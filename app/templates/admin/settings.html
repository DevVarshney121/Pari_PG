<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Settings</title><link rel="stylesheet" href="{{url_for('static',filename='admin.css')}}"></head><body><header class="admin-head"><div class="admin-brand">Pari<span>Pg</span><small>Admin</small></div><a class="logout" href="{{url_for('site.admin_dashboard')}}">Back</a></header><main class="form-page"><section class="panel form-card wide"><h1>Website Settings</h1><p>Edit the main contact details and hero content shown on the website.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post">{% for f in fields %}<label>{{f.replace('_',' ').title()}}{% if f in ['hero_description','map_url'] %}<textarea name="{{f}}" rows="3">{{row[f]}}</textarea>{% else %}<input name="{{f}}" value="{{row[f]}}" required>{% endif %}</label>{% endfor %}<button class="primary">Save Website Settings</button></form></section></main></body></html>
