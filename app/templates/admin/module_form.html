<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{'Edit' if row else 'Add'}} {{module.title}}</title><link rel="stylesheet" href="{{url_for('static',filename='admin.css')}}"></head><body><header class="admin-head"><div class="admin-brand">Pari<span>Pg</span><small>Admin</small></div><a class="logout" href="{{url_for('site.module_list',key=key)}}">Back</a></header><main class="form-page"><section class="panel form-card"><h1>{{'Edit' if row else 'Add'}} {{module.title}}</h1><form method="post">{% for f in module.fields %}<label>{{module.labels[f]}}{% if f in ['active'] %}<select name="{{f}}"><option value="1" {% if row and row[f] %}selected{% endif %}>Active / Yes</option><option value="0" {% if row and not row[f] %}selected{% endif %}>Inactive / No</option></select>{% elif f in ['description','features','meta','text','answer'] %}<textarea name="{{f}}" {% if f=='description' %}rows="5"{% else %}rows="4"{% endif %}>{{row[f] if row else ''}}</textarea>{% elif f in ['sort_order','beds','available','rating'] %}<input type="number" name="{{f}}" value="{{row[f] if row else 0}}">{% else %}<input name="{{f}}" value="{{row[f] if row else ''}}" required>{% endif %}</label>{% endfor %}<button class="primary">Save</button></form></section></main></body></html>
