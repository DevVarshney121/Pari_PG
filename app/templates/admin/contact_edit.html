<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Contact</title><link rel="stylesheet" href="{{url_for('static',filename='admin.css')}}"></head><body><header class="admin-head"><div class="admin-brand">Pari<span>Pg</span></div><a class="logout" href="{{url_for('site.admin_dashboard')}}">Back</a></header><main class="form-page"><section class="panel form-card"><h1>Edit Contact #{{row.id}}</h1><form method="post"><label>Name<input name="name" value="{{row.name}}" required></label><label>Email<input type="email" name="email" value="{{row.email}}" required></label><label>Phone<input name="phone" value="{{row.phone}}" required></label><label>Message<textarea name="message" required>{{row.message}}</textarea></label><button class="primary">Save Changes</button></form></section></main></body></html>
